<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>找不到页面 · 唐维西</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="assets/favicon.svg?v=934fb8ef6e" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=934fb8ef6e">
<link rel="manifest" href="site.webmanifest?v=934fb8ef6e">
<link rel="stylesheet" href="assets/style.css?v=934fb8ef6e">
</head>
<body data-theme="light">

<div class="ambient" aria-hidden="true"></div>

<div class="container page-shell">
  <div class="notfound">
    <div class="notfound-code">404</div>
    <h1 class="notfound-title">这一页不存在</h1>
    <p class="notfound-desc">链接可能拼错了，或者这篇内容已经被移走。</p>
    <div class="notfound-actions">
      <a class="back-link" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        回到首页
      </a>
      <a class="back-link" href="archive.html">看看归档</a>
    </div>
  </div>
</div>

<script>
  // 跟随系统 / 用户已保存的深浅色偏好
  (function () {
    var saved = localStorage.getItem('tw-theme');
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var theme = saved || (dark ? 'dark' : 'light');
    document.body.setAttribute('data-theme', theme);
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
</body>
</html>
