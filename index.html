<!-- 悬浮玻璃 Dock：一开始是透明的，滚动后凝聚成胶囊 -->

    <a class="dock-brand" href="#top" id="dockBrand">
      <span class="dock-brand-mark" id="dockMark"></span>
      <span class="dock-brand-name" id="dockName">唐维西</span>
    </a>
    <div class="dock-spacer"></div>
    <div class="dock-actions">
      <a class="dock-link" href="archive.html" id="navArchive">归档</a>
      <a class="dock-link" href="about.html" id="navAbout">关于</a>
      <button class="glass-btn" id="langToggle" aria-label="切换语言" title="中 / English">En</button>
      <button class="glass-btn" id="themeToggle" aria-label="切换深浅色" title="深色 / 浅色">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.4 6.4-.7-.7M6.3 6.3l-.7-.7m12.7 0-.7.7M6.3 17.7l-.7.7M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0z"/>

          <path d="M20.4 15.4A9 9 0 0 1 8.6 3.6 9 9 0 1 0 20.4 15.4z"/>
        </svg>
      </button>
    </div>
  </div>
</nav>

<div class="container" id="top">

  <!-- 身份面板 + Apple Music 风格爵士乐播放器 -->
  <header class="hero">
    <div class="hero-panel">
      <div class="hero-avatar">
        <div class="logo-icon" id="logoSlot"></div>
      </div>
      <div class="hero-text">
        <p class="hero-eyebrow" id="heroEyebrow"></p>
        <h1 class="site-title" id="siteTitle">唐维西</h1>
        <p class="hero-tagline" id="siteTagline">技术探索与个人随笔</p>
      </div>

      <!-- 嵌入右侧空地的 Apple Music 风格播放器 -->
      <div class="jazz-player" id="jazzBar" hidden>
        <div class="jp-art" aria-hidden="true">
          <img class="jp-cover" alt="" width="140" height="140" draggable="false">
          <div class="jp-cover-fallback"></div>
          <div class="jp-art-glow"></div>
        </div>
        <div class="jp-body">
          <div class="jp-meta">
            <span class="jp-label">Now Playing</span>
            <span class="jp-title">即将播放</span>
            <span class="jp-artist">经典爵士乐</span>
          </div>
          <div class="jp-scrub" role="slider" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
            <div class="jp-progress">
              <div class="jp-filled"></div>
              <div class="jp-knob"></div>
            </div>
            <div class="jp-time-row">
              <span class="jp-cur">0:00</span>
              <span class="jp-dur">–:–</span>
            </div>
          </div>
          <div class="jp-controls">
            <button class="jp-btn jp-prev" aria-label="上一首" title="上一首">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg>
            </button>
            <button class="jp-btn jp-play" aria-label="播放/暂停" title="播放爵士乐">
              <svg class="jp-ico-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              <svg class="jp-ico-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
            </button>
            <button class="jp-btn jp-next" aria-label="下一首" title="下一首">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6zM16 6h2v12h-2z"/></svg>
            </button>
            <button class="jp-btn jp-vol" aria-label="静音切换" title="静音 / 恢复">
              <svg class="jp-ico-vol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                <path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/>
              </svg>
              <svg class="jp-ico-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                <path d="M23 9l-6 6M17 9l6 6"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="hero-links-wrap" id="linksBar" hidden>
        <ul class="hero-links" id="linksList"></ul>
      </div>
    </div>
  </header>

  <!-- 吸顶筛选条 -->
  <div class="toolbar-sentinel" id="toolbarSentinel" aria-hidden="true"></div>
  <section class="toolbar" id="toolbar">
    <div class="search-box" id="searchBox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>
      <input type="search" id="searchInput" autocomplete="off" placeholder="搜索文章…">
      <button class="search-clear" id="searchClear" aria-label="清空">✕</button>
    </div>
    <div class="tag-scroller">
      <div class="tag-filters" id="tagFilters"></div>
    </div>
    <div class="result-count" id="resultCount"></div>
  </section>

  <!-- 文章网格 -->
  <main class="grid" id="grid"></main>

  <footer class="site-footer" id="siteFooter"></footer>
</div>

<!-- 写文章按钮：只在本机运行时出现 -->
