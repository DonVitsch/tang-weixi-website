<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>唐维西</title>
<meta name="description" content="唐维西的个人网站：技术探索与个人随笔。">
<meta property="og:type" content="website">
<meta property="og:title" content="唐维西">
<meta property="og:description" content="唐维西的个人网站：技术探索与个人随笔。">
<meta name="twitter:card" content="summary">
<link rel="alternate" type="application/rss+xml" title="唐维西" href="feed.xml">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-theme="light">

<a class="skip-link" href="#grid">跳到文章列表</a>

<!-- 环境层：给上面的玻璃提供可折射的内容 -->
<div class="ambient" aria-hidden="true"></div>

<!-- 悬浮玻璃 Dock：一开始是透明的，滚动后凝聚成胶囊 -->
<nav class="dock" id="dock">
  <div class="dock-inner">
    <a class="dock-brand" href="#top" id="dockBrand">
      <span class="dock-brand-mark" id="dockMark"></span>
      <span class="dock-brand-name" id="dockName">唐维西</span>
    </a>
    <div class="dock-spacer"></div>
    <div class="dock-actions">
      <a class="dock-link" href="archive.html" id="navArchive">归档</a>
      <a class="dock-link" href="about.html" id="navAbout">关于</a>
      <button class="glass-btn" id="langToggle" aria-label="切换语言" title="中 / English">En</button>
      <button class="glass-btn" id="themeToggle" aria-label="切换深浅色" title="深色 / 浅色">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.4 6.4-.7-.7M6.3 6.3l-.7-.7m12.7 0-.7.7M6.3 17.7l-.7.7M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0z"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.4 15.4A9 9 0 0 1 8.6 3.6 9 9 0 1 0 20.4 15.4z"/>
        </svg>
      </button>
    </div>
  </div>
</nav>

<div class="container" id="top">

  <!-- 身份面板 -->
  <header class="hero">
    <div class="hero-panel">
      <div class="hero-avatar">
        <div class="logo-icon" id="logoSlot"></div>
      </div>
      <div class="hero-text">
        <p class="hero-eyebrow" id="heroEyebrow"></p>
        <h1 class="site-title" id="siteTitle">唐维西</h1>
        <p class="hero-tagline" id="siteTagline">技术探索与个人随笔</p>
      </div>
      <div class="hero-links-wrap" id="linksBar" hidden>
        <ul class="hero-links" id="linksList"></ul>
      </div>
    </div>
  </header>

  <!-- 吸顶筛选条 -->
  <div class="toolbar-sentinel" id="toolbarSentinel" aria-hidden="true"></div>
  <section class="toolbar" id="toolbar">
    <div class="search-box" id="searchBox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>
      <input type="search" id="searchInput" autocomplete="off" placeholder="搜索文章…">
      <button class="search-clear" id="searchClear" aria-label="清空">✕</button>
    </div>
    <div class="tag-scroller">
      <div class="tag-filters" id="tagFilters"></div>
    </div>
    <div class="result-count" id="resultCount"></div>
  </section>

  <!-- 文章网格 -->
  <main class="grid" id="grid"></main>

  <footer class="site-footer" id="siteFooter"></footer>
</div>

<!-- 写文章按钮：只在本机运行时出现 -->
<a class="fab" href="admin.html" id="writeFab">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>
  </svg>
  <span id="fabText">写文章</span>
</a>

<!-- 数据（自动生成，别手改） -->
<script src="data/site.js"></script>
<script src="data/articles.js"></script>
<!-- 逻辑 -->
<script src="assets/common.js"></script>
<script src="assets/home.js"></script>
</body>
</html>
